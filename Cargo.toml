[package]
name = "cetakin"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Cetakin - aplikasi cetak foto & konversi dokumen untuk digital printing"
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "default_fonts",
    "wayland",
    "x11",
    "links",
    "clipboard",
] }
image = { version = "0.24", default-features = false, features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
    "tiff",
    "webp",
] }
printpdf = { version = "0.7.0", features = ["embedded_images"] }
lopdf = "0.31"
pdf-extract = "0.12"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
rfd = { version = "0.18", default-features = false, features = ["gtk3"] }
kamadak-exif = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
open = "5"

[profile.release]
lto = "thin"
strip = true
opt-level = 3

[profile.dev]
opt-level = 1
# Tanpa debug info, `cargo run` menghasilkan binary ~25 MB (bukan ~380 MB).
# Backtrace tetap menampilkan nama fungsi karena symbol table dipertahankan.
debug = 0
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 2
